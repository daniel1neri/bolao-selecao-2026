<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  :root{--f-titulo:"Bebas Neue",sans-serif;--verde:#0a7a3e;--verde-claro:#12a855;--amarelo:#f5c800;--azul:#003087;--fundo:#0d1117;--card:#161b22;--borda:#21262d;--texto:#e6edf3;--muted:#7d8590;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--fundo);color:var(--texto);font-family:'Inter',sans-serif;min-height:100vh;}
  header{background:linear-gradient(135deg,var(--verde) 0%,var(--azul) 100%);padding:28px 24px 20px;text-align:center;position:relative;overflow:hidden;}
  header::before{content:'⚽';position:absolute;font-size:200px;opacity:0.05;top:-40px;right:-20px;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:3px;color:var(--amarelo);text-shadow:2px 2px 0 rgba(0,0,0,0.4);}
  header p{font-size:0.8rem;color:rgba(255,255,255,0.6);margin-top:4px;letter-spacing:1px;text-transform:uppercase;}
  .header-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .badge{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:5px 14px;font-size:0.78rem;font-weight:600;}
  .btn-reload{background:var(--amarelo);color:#000;border:none;border-radius:20px;padding:7px 18px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity 0.15s;display:flex;align-items:center;gap:6px;}
  .btn-reload:hover{opacity:0.85;}
  .btn-reload.loading{opacity:0.6;pointer-events:none;}
  .status-bar{background:rgba(0,0,0,0.25);padding:5px 16px;font-size:0.7rem;color:rgba(255,255,255,0.5);text-align:center;}
  .abas{display:flex;background:var(--card);border-bottom:1px solid var(--borda);overflow-x:auto;}
  .aba-btn{flex:1;min-width:80px;padding:12px 8px;background:transparent;border:none;color:var(--muted);font-size:0.72rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.5px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;}
  .aba-btn:hover{color:var(--texto);}
  .aba-btn.active{color:var(--amarelo);border-bottom-color:var(--amarelo);}
  .placar-geral{display:flex;gap:12px;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--borda);flex-wrap:wrap;justify-content:center;}
  .placar-card{background:var(--fundo);border:1px solid var(--borda);border-radius:10px;padding:12px 20px;text-align:center;min-width:100px;}
  .placar-card .nome{font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .placar-card .pts{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--amarelo);line-height:1;}
  .placar-card .label{font-size:0.65rem;color:var(--muted);margin-top:2px;}
  .placar-card.lider{border-color:var(--amarelo);}
  .placar-card.lider .nome{color:var(--amarelo);}
  .filtros{display:flex;gap:8px;overflow-x:auto;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--borda);scrollbar-width:none;}
  .filtros::-webkit-scrollbar{display:none;}
  .filtro-btn{background:transparent;border:1px solid var(--borda);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.15s;font-family:'Inter',sans-serif;}
  .filtro-btn:hover{border-color:var(--verde-claro);color:var(--verde-claro);}
  .filtro-btn.active{background:var(--verde);border-color:var(--verde);color:#fff;}
  .legenda{display:flex;gap:16px;padding:10px 24px;font-size:0.72rem;color:var(--muted);flex-wrap:wrap;background:var(--fundo);border-bottom:1px solid var(--borda);}
  .legenda-item{display:flex;align-items:center;gap:6px;}
  .legenda-dot{width:10px;height:10px;border-radius:50%;}
  .main{padding:24px;max-width:1400px;margin:0 auto;}
  .grupo-section{margin-bottom:32px;}
  .grupo-titulo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--amarelo);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--verde);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .grupo-titulo span{font-family:'Inter',sans-serif;font-size:0.7rem;color:var(--muted);font-weight:500;}
  .grupo-resultado{font-family:'Inter',sans-serif;font-size:0.7rem;margin-left:auto;color:var(--verde-claro);font-weight:600;}
  .comparativo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .card-pessoa{background:var(--card);border:1px solid var(--borda);border-radius:10px;overflow:hidden;transition:transform 0.15s;}
  .card-pessoa:hover{transform:translateY(-2px);border-color:var(--verde);}
  .card-header{padding:8px 14px;font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--borda);color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
  .card-pts{font-size:0.7rem;color:var(--amarelo);}
  .time-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--borda);font-size:0.82rem;}
  .time-item:last-child{border-bottom:none;}
  .time-item.acerto-pos{background:rgba(18,168,85,0.1);}
  .time-item.acerto-time{background:rgba(245,200,0,0.06);}
  .posicao{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;flex-shrink:0;}
  .pos-1{background:#FFD700;color:#000;}
  .pos-2{background:#C0C0C0;color:#000;}
  .pos-3{background:#CD7F32;color:#fff;}
  .pos-4{background:var(--borda);color:var(--muted);}
  .time-nome{font-weight:500;flex:1;}
  .ponto-badge{font-size:0.65rem;padding:2px 6px;border-radius:4px;font-weight:700;}
  .ponto-2{background:rgba(18,168,85,0.2);color:var(--verde-claro);}
  .ponto-1{background:rgba(245,200,0,0.15);color:var(--amarelo);}
  /* MATA-MATA */
  .mm-jogo{background:var(--card);border:1px solid var(--borda);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .mm-jogo-header{padding:10px 16px;background:var(--borda);font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .mm-confronto{color:var(--texto);}
  .mm-resultado{color:var(--verde-claro);font-size:0.7rem;}
  .mm-resultado.pendente{color:var(--muted);}
  .mm-palpites{display:flex;flex-wrap:wrap;}
  .mm-palpite{flex:1;min-width:110px;padding:10px 16px;border-right:1px solid var(--borda);border-top:1px solid var(--borda);}
  .mm-palpite:last-child{border-right:none;}
  .mm-palpite-nome{font-size:0.65rem;color:var(--muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;}
  .mm-palpite-time{font-size:0.85rem;font-weight:600;}
  .mm-palpite.acerto .mm-palpite-time{color:var(--verde-claro);}
  .mm-palpite.erro .mm-palpite-time{color:var(--muted);text-decoration:line-through;}
  .mm-palpite.sem-palpite .mm-palpite-time{color:var(--muted);font-style:italic;}
  .mm-pts{font-size:0.65rem;color:var(--amarelo);font-weight:700;margin-top:2px;}
  .hidden{display:none;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--verde);color:#fff;padding:10px 20px;border-radius:20px;font-size:0.8rem;font-weight:600;transition:transform 0.3s;z-index:999;}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="aba-grupos" class="hidden">

  </div>

</div>

    <div class="legenda-item"><div class="legenda-dot" style="background:var(--verde-claro)"></div> Acertou (+2pts)</div>
    <div class="legenda-item"><div class="legenda-dot" style="background:var(--muted)"></div> Errou</div>
  </div>
  <div class="main" id="conteudo-avos"></div>
</div>

<!-- OITAVAS -->
<div id="aba-oitavas" class="hidden">

  </div>

<!-- QUARTAS -->

<!-- SEMI -->

    <div class="legenda-item"><div class="legenda-dot" style="background:var(--verde-claro)"></div> Acertou (+2pts)</div>
  </div>
  <div class="main" id="conteudo-semi"></div>
</div>

<!-- FINAL -->

  <div class="legenda">
    <div class="legenda-item"><div class="legenda-dot" style="background:var(--amarelo)"></div> Final + 3º lugar (+2pts cada)</div>
  </div>
  <div class="main" id="conteudo-final"></div>

];

const JOGOS_FINAL = [
  { id:'fi01', confronto:'Espanha x Argentina',     palpites:{ Breno:null,        Daniel:'Espanha',   João:'Espanha',   Mario:'Espanha',    Thiagão:'Espanha'   } },
  { id:'fi02', confronto:'França x Inglaterra',     palpites:{ Breno:null,        Daniel:'França',    João:'França',    Mario:'França',     Thiagão:'França'    }, label:'3º lugar' },
];

const PARTICIPANTES = ["Breno","Daniel","João","Mario","Thiagão"];

// ─── RESULTADOS (da planilha) ─────────────────────────────────────────────────
let RES_GRUPOS = {A:{},B:{},C:{},D:{},E:{},F:{},G:{},H:{},I:{},J:{},K:{},L:{}};
let RES_MM = {};

// ─── NORMALIZAÇÃO ─────────────────────────────────────────────────────────────
const SINONIMOS = {
  'tchéquia':'Rep. Tcheca','república tcheca':'Rep. Tcheca','rep. tcheca':'Rep. Tcheca',
  'eua':'EUA','estados unidos':'EUA','usa':'EUA',
  'holanda':'Holanda','países baixos':'Holanda',
  'rd congo':'RD Congo',
  'costa do marfim':'Costa do Marfim',
  'bósnia e herzegovina':'Bósnia','bosnia':'Bósnia',
};
function norm(n){ if(!n) return ''; return SINONIMOS[n.toLowerCase().trim()] || n.trim(); }

// ─── CARREGAR ─────────────────────────────────────────────────────────────────
async function carregarSheets(){
  const btn=document.querySelector('.btn-reload');
  const icon=document.getElementById('reload-icon');
  btn.classList.add('loading'); icon.textContent='⏳';

  function processarJSON(json){
    Object.entries(json).forEach(([k,val])=>{
      if(RES_GRUPOS[k]!==undefined){
        RES_GRUPOS[k]={ '1o':val['1o']||'', '2o':val['2o']||'' };
      } else {
        RES_MM[k] = norm(val['vencedor']||val['1o']||'');
      }
    });
    renderTudo();
    btn.classList.remove('loading'); icon.textContent='↻';
    document.getElementById('status-bar').textContent='✅ Atualizado em '+new Date().toLocaleTimeString('pt-BR');
    mostrarToast('✅ Placar atualizado!');
  }

  // Tenta 1: fetch direto (funciona no GitHub Pages)
  try {
    const res = await fetch(SHEETS_URL+'&t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    processarJSON(json);
    return;
  } catch(e1){ /* segue pro próximo */ }

  // Tenta 2: proxy allorigins
  try {
    const proxy = 'https://api.allorigins.win/raw?url='+encodeURIComponent(SHEETS_URL);
    const res = await fetch(proxy);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    processarJSON(json);
    return;
  } catch(e2){ /* segue pro próximo */ }

  // Tenta 3: JSONP (último recurso)
  await new Promise((resolve, reject)=>{
    const old = document.getElementById('jsonp-script');
    if(old) old.remove();
    const timeout = setTimeout(()=>{ reject(new Error('timeout')); }, 8000);
    window._jsonpCallback = function(json){
      clearTimeout(timeout);
      processarJSON(json);
      resolve();
    };
    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = SHEETS_URL+'?callback=_jsonpCallback&t='+Date.now();
    script.onerror = ()=>{ clearTimeout(timeout); reject(new Error('script error')); };
    document.head.appendChild(script);
  }).catch(e=>{
    btn.classList.remove('loading'); icon.textContent='↻';
    document.getElementById('status-bar').textContent='⚠️ Erro ao carregar planilha';
    mostrarToast('❌ Erro ao carregar');
  });
}

// ─── PONTUAÇÃO ────────────────────────────────────────────────────────────────
function calcularPontosGrupo(palpite, resultado){
  if(!resultado||(!resultado['1o']&&!resultado['2o'])) return {pontos:0,detalhes:[null,null,null,null]};
  const cls=[norm(resultado['1o']),norm(resultado['2o'])].filter(Boolean);
  const det=[null,null,null,null]; let pts=0;
  palpite.forEach((time,idx)=>{
    if(idx>=2) return;
    const tn=norm(time); const posReal=cls.indexOf(tn);
    if(posReal===-1) return;
    if((posReal===0&&idx===0)||(posReal===1&&idx===1)){det[idx]='pos';pts+=2;}
    else{det[idx]='time';pts+=1;}
  });
  return {pontos:pts,detalhes:det};
}

function ptsMM(jogos, pessoa){
  return jogos.reduce((acc,j)=>{
    const v=RES_MM[j.id]; if(!v) return acc;
    const pal=j.palpites[pessoa]; if(!pal) return acc;
    return acc+(norm(pal)===norm(v)?2:0);
  },0);
}

function placarTotal(){
  const t={};
  PARTICIPANTES.forEach(p=>{
    let pts=0;
    Object.entries(PALPITES_GRUPOS).forEach(([g,pal])=>{ if(pal[p]) pts+=calcularPontosGrupo(pal[p],RES_GRUPOS[g]||{}).pontos; });
    pts+=ptsMM(JOGOS_AVOS,p)+ptsMM(JOGOS_OITAVAS,p)+ptsMM(JOGOS_QUARTAS,p)+ptsMM(JOGOS_SEMI,p)+ptsMM(JOGOS_FINAL,p);
    t[p]=pts;
  });
  return t;
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function renderCards(containerId, totais){
  const sorted=Object.entries(totais).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]??0;
  document.getElementById(containerId).innerHTML=sorted.map(([nome,pts],i)=>`
    <div class="placar-card ${pts===max&&pts>0?'lider':''}">
      <div class="nome">${i===0&&pts>0?'🏆 ':''}${nome}</div>
      <div class="pts">${pts}</div>
      <div class="label">pts</div>
    </div>`).join('') || '<div style="color:var(--muted);font-size:0.8rem;padding:8px">Aguardando resultados...</div>';
}

function renderJogosMM(containerId, jogos){
  document.getElementById(containerId).innerHTML = jogos.map(jogo=>{
    const v=norm(RES_MM[jogo.id]||'');
    const tem=!!v;
    const label=jogo.label?`[${jogo.label}] `:'';
    return `<div class="mm-jogo">
      <div class="mm-jogo-header">
        <span class="mm-confronto">⚔️ ${label}${jogo.confronto}</span>
        <span class="mm-resultado ${tem?'':'pendente'}">${tem?'✓ '+v:'Aguardando'}</span>
      </div>
      <div class="mm-palpites">
        ${PARTICIPANTES.map(p=>{
          const pal=jogo.palpites[p];
          const semPal=!pal;
          const acertou=tem&&!semPal&&norm(pal)===v;
          const errou=tem&&!semPal&&norm(pal)!==v;
          return `<div class="mm-palpite ${acertou?'acerto':errou?'erro':semPal?'sem-palpite':''}">
            <div class="mm-palpite-nome">${p}</div>
            <div class="mm-palpite-time">${semPal?'—':pal}</div>
            ${acertou?'<div class="mm-pts">+2 pts</div>':''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

// ─── RENDER TUDO ─────────────────────────────────────────────────────────────
function renderTudo(){
  // Placar por fase
  const ptGrupos={},mmAv={},mmOi={},mmQt={},mmSf={},mmFi={};
  PARTICIPANTES.forEach(p=>{
    let s=0; Object.entries(PALPITES_GRUPOS).forEach(([g,pal])=>{ if(pal[p]) s+=calcularPontosGrupo(pal[p],RES_GRUPOS[g]||{}).pontos; }); ptGrupos[p]=s;
    mmAv[p]=ptsMM(JOGOS_AVOS,p); mmOi[p]=ptsMM(JOGOS_OITAVAS,p); mmQt[p]=ptsMM(JOGOS_QUARTAS,p); mmSf[p]=ptsMM(JOGOS_SEMI,p); mmFi[p]=ptsMM(JOGOS_FINAL,p);
  });
  renderCards('placar-geral',ptGrupos);
  renderCards('placar-avos',mmAv);
  renderCards('placar-oitavas',mmOi);
  renderCards('placar-quartas',mmQt);
  renderCards('placar-semi',mmSf);
  renderCards('placar-final',mmFi);
  // Jogos
  renderJogosMM('conteudo-avos',JOGOS_AVOS);
  renderJogosMM('conteudo-oitavas',JOGOS_OITAVAS);
  renderJogosMM('conteudo-quartas',JOGOS_QUARTAS);
  renderJogosMM('conteudo-semi',JOGOS_SEMI);
  renderJogosMM('conteudo-final',JOGOS_FINAL);
  // Grupos
  renderFiltros(); renderGrupos('todos');
  // Placar detalhado
  renderPlacarDetalhado();
}

function renderFiltros(){
  let html='<button class="filtro-btn active" onclick="filtrarGrupo(\'todos\',this)">Todos</button>';
  Object.keys(PALPITES_GRUPOS).forEach(g=>{ html+=`<button class="filtro-btn" onclick="filtrarGrupo('${g}',this)">Grupo ${g}</button>`; });
  document.getElementById('filtros-grupos').innerHTML=html;
}

let filtroGrupoAtivo='todos';
function renderGrupos(filtro){
  if(filtro!==undefined) filtroGrupoAtivo=filtro;
  let html='';
  Object.entries(PALPITES_GRUPOS).forEach(([grupo,palpites])=>{
    if(filtroGrupoAtivo!=='todos'&&filtroGrupoAtivo!==grupo) return;
    const res=RES_GRUPOS[grupo]||{};
    const tem=res['1o']||res['2o'];
    const allTimes=[...new Set(Object.values(palpites).flat().filter(t=>t).map(norm))];
    html+=`<div class="grupo-section">
      <div class="grupo-titulo">GRUPO ${grupo} <span>${allTimes.slice(0,4).join(' · ')}</span>
        <span class="grupo-resultado">${tem?`✓ ${res['1o']} · ${res['2o']}`:'Aguardando'}</span>
      </div>
      <div class="comparativo">`;
    PARTICIPANTES.forEach(pessoa=>{
      const pal=palpites[pessoa];
      const temPal=pal&&pal.filter(t=>t).length>0;
      const {pontos,detalhes}=temPal?calcularPontosGrupo(pal,res):{pontos:0,detalhes:[]};
      html+=`<div class="card-pessoa"><div class="card-header"><span>${pessoa}</span>${tem&&temPal?`<span class="card-pts">${pontos>0?'+'+pontos:'0'} pts</span>`:''}</div>`;
      if(temPal){
        pal.forEach((time,i)=>{ if(!time) return;
          const pc=['pos-1','pos-2','pos-3','pos-4'][i]; const ac=detalhes[i];
          html+=`<div class="time-item ${ac==='pos'?'acerto-pos':ac==='time'?'acerto-time':''}"><div class="posicao ${pc}">${i+1}</div><span class="time-nome">${time}</span>${ac==='pos'?'<span class="ponto-badge ponto-2">+2</span>':''}${ac==='time'?'<span class="ponto-badge ponto-1">+1</span>':''}</div>`;
        });
      } else {
        html+=`<div class="time-item" style="color:var(--muted);font-size:0.75rem;justify-content:center;padding:16px">Palpite não enviado</div>`;
      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('conteudo-grupos').innerHTML=html;
}

function renderPlacarDetalhado(){
  const total=placarTotal();
  const sorted=Object.entries(total).sort((a,b)=>b[1]-a[1]);
  const fases=[
    {label:'Grupos', fn:p=>{ let s=0; Object.entries(PALPITES_GRUPOS).forEach(([g,pal])=>{ if(pal[p]) s+=calcularPontosGrupo(pal[p],RES_GRUPOS[g]||{}).pontos; }); return s; }},
    {label:'16 Avos', fn:p=>ptsMM(JOGOS_AVOS,p)},
    {label:'Oitavas', fn:p=>ptsMM(JOGOS_OITAVAS,p)},
    {label:'Quartas', fn:p=>ptsMM(JOGOS_QUARTAS,p)},
    {label:'Semi', fn:p=>ptsMM(JOGOS_SEMI,p)},
    {label:'Final', fn:p=>ptsMM(JOGOS_FINAL,p)},
  ];
  const medalhas=['🥇','🥈','🥉','4️⃣','5️⃣'];
  const nFases = fases.length;

  let html = '';

  // Cards grandes do ranking
  html += '<h2 style="font-family:var(--f-titulo);font-size:1.5rem;letter-spacing:2px;color:var(--amarelo);margin-bottom:16px">Ranking Geral</h2>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px">';
  sorted.forEach(function([nome,tot],rank){
    const cores=['#FFD700','#C0C0C0','#CD7F32','var(--borda)','var(--borda)'];
    html += '<div style="background:var(--card);border:2px solid '+cores[rank]+';border-radius:12px;padding:16px;text-align:center">';
    html += '<div style="font-size:1.8rem;margin-bottom:4px">'+medalhas[rank]+'</div>';
    html += '<div style="font-size:0.75rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">'+nome+'</div>';
    html += '<div style="font-size:2.5rem;color:var(--amarelo);line-height:1;font-weight:900">'+tot+'</div>';
    html += '<div style="font-size:0.65rem;color:var(--muted)">pontos</div>';
    html += '</div>';
  });
  html += '</div>';

  // Tabela breakdown
  html += '<h2 style="font-family:var(--f-titulo);font-size:1.5rem;letter-spacing:2px;color:var(--amarelo);margin-bottom:16px">Pontos por Fase</h2>';
  html += '<div style="background:var(--card);border:1px solid var(--borda);border-radius:10px;overflow:hidden">';

  // Header
  html += '<div style="display:grid;grid-template-columns:130px repeat('+nFases+',1fr);background:var(--borda);padding:10px 16px;font-size:0.65rem;font-weight:700;text-transform:uppercase;color:var(--muted)">';
  html += '<span>Nome</span>';
  fases.forEach(function(f){ html += '<span style="text-align:center">'+f.label+'</span>'; });
  html += '</div>';

  sorted.forEach(function([nome,tot],rank){
    html += '<div style="display:grid;grid-template-columns:130px repeat('+nFases+',1fr);padding:10px 16px;border-top:1px solid var(--borda);align-items:center">';
    html += '<span style="font-weight:700;font-size:0.82rem">'+medalhas[rank]+' '+nome+'</span>';
    fases.forEach(function(f){
      const p=f.fn(nome);
      html += '<span style="text-align:center;font-weight:600;font-size:0.8rem;color:'+(p>0?'var(--verde-claro)':'var(--muted)')+'">'+( p>0?'+'+p+' pts':'-')+'</span>';
    });
    html += '</div>';
  });
  html += '</div>';

  document.getElementById('placar-detalhado').innerHTML=html;
}

function filtrarGrupo(grupo,btn){
  document.querySelectorAll('#filtros-grupos .filtro-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderGrupos(grupo);
}
function trocarAba(aba,btn){
  document.querySelectorAll('.aba-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['grupos','avos','oitavas','quartas','semi','final','placar'].forEach(a=>document.getElementById('aba-'+a).classList.add('hidden'));
  document.getElementById('aba-'+aba).classList.remove('hidden');
}
function mostrarToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Placar é a aba inicial
renderTudo();
carregarSheets();
</script>
